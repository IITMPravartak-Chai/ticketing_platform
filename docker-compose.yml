# PostgreSQL for mlops_service_desk.py. Start with: docker compose up -d
# Credentials come from .env (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD). Data lives in the servicedesk_pgdata volume.
# The explicit project name keeps this separate from any other compose project in a folder with the same name.
name: mlops-servicedesk
services:
  postgres:
    image: postgres:16-alpine
    container_name: servicedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicedesk}
      POSTGRES_USER: ${POSTGRES_USER:-servicedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - servicedesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  servicedesk_pgdata:
